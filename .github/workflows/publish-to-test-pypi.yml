name: Publish to Test PyPI

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-n-publish-test-pypi:
    if: github.repository == 'scanapi/scanapi'
    name: Test PyPI - Build and publish Python 🐍 distributions 📦
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ScanAPI repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5.6.0
        with:
          python-version: 3.12.x
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 #v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install Dependencies
        run: uv sync --extra dev --prerelease=allow
      - name: Run pre-release version update
        run: |
          make change-version
      - name: Build and publish to test pypi
        run: |
          uv build
          uv publish --publish-url https://test.pypi.org/legacy/ --token ${{ secrets.TEST_PYPI_TOKEN }}
