name: ScanAPI Examples

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changed-files.outputs.docs_only }}
    steps:
      - name: Checkout ScanAPI repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check changed files
        id: changed-files
        uses: ./.github/actions/changed-files-check
        
  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Checkout ScanAPI repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and Inspect
        uses: hynek/build-and-inspect-python-package@fdf34a910b6a2985b8bbe0e4ec3d389f7832ef74 # v2.18.0
      - name: Build distributions explicitly
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Upload distributions
        uses:  actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error


  poke-api:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-package
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Download artifact from build package job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
      - name: Checkout ScanAPI repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Examples
        uses: ./.github/actions/run_examples
        with:
          api-name: PokeAPI
          command: "uv run scanapi run ./examples/pokeapi/scanapi.yaml -c ./examples/pokeapi/scanapi.conf -o pokeapi.html"
          output-path: pokeapi.html

  httpbingo-api:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-package
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Download artifact from build package job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
      - name: Checkout ScanAPI repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Examples
        uses: ./.github/actions/run_examples
        with:
          api-name: httpbingo.org
          command: "uv run scanapi run ./examples/httpbingo-api/httpbingo.yaml -c ./examples/httpbingo-api/scanapi.conf -o httpbingo.html"
          output-path: httpbingo.html

  demo-api:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-package
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Download artifact from build package job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
      - name: Checkout ScanAPI repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Examples
        env:
          BASE_URL: "https://demo-api.fly.dev/api/v1/"
          USER: "scanapi-workflow"
          PASSWORD: "${{ secrets.DEMO_API_PASSWORD }}"
        uses: ./.github/actions/run_examples
        with:
          api-name: Demo API
          command: "uv run scanapi run ./examples/demo-api/scanapi.yaml -c ./examples/demo-api/scanapi.conf -o demo-api.html"
          output-path: demo-api.html
