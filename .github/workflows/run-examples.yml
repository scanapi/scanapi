name: ScanAPI Examples

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:  
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changed-files.outputs.docs_only }}
    steps:
      - name: Checkout ScanAPI repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check changed files
        id: changed-files
        uses: ./.github/actions/changed-files-check
        
  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Checkout ScanAPI repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build and Inspect
        uses: hynek/build-and-inspect-python-package@fdf34a910b6a2985b8bbe0e4ec3d389f7832ef74 # v2.18.0
      - name: Build distributions explicitly
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Upload distributions
        uses:  actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error


  poke-api:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-package
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Download artifact from build package job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - name: Checkout ScanAPI repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Examples
        uses: ./.github/actions/run_examples
        with:
          api-name: PokeAPI
          command: "uv run scanapi run ./examples/pokeapi/scanapi.yaml -c ./examples/pokeapi/scanapi.conf -o pokeapi.html"
          output-path: pokeapi.html

  httpbingo-api:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-package
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Download artifact from build package job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - name: Checkout ScanAPI repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Examples
        uses: ./.github/actions/run_examples
        with:
          api-name: httpbingo.org
          command: "uv run scanapi run ./examples/httpbingo-api/httpbingo.yaml -c ./examples/httpbingo-api/scanapi.conf -o httpbingo.html"
          output-path: httpbingo.html

  demo-api:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-package
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Download artifact from build package job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - name: Checkout ScanAPI repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Examples
        env:
          BASE_URL: "https://demo-api.fly.dev/api/v1/"
          USER: "scanapi-workflow"
          PASSWORD: Q*jW@p8pVmHwm2RwQd8ZR8LK
        uses: ./.github/actions/run_examples
        with:
          api-name: Demo API
          command: "uv run scanapi run ./examples/demo-api/scanapi.yaml -c ./examples/demo-api/scanapi.conf -o demo-api.html"
          output-path: demo-api.html
