name: Test Package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: write


jobs:
  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ScanAPI repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build and Inspect
        uses: hynek/build-and-inspect-python-package@v2.18.0

  test-package:
    name: Test Package
    runs-on: ubuntu-latest
    needs: build-package
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout ScanAPI repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download artifact from build package job
        uses: actions/download-artifact@v3.2.0
        with:
          name: dist
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: pip install dist/*.whl
      - name: Run tests
        uses: ./run-examples

