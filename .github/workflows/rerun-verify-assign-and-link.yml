name: Rerun Verify Assign and Link

on:
  issues:
    types:
      - assigned
      - unassigned

permissions:
  contents: read
  issues: read
  actions: write

jobs:
  rerun-workflow:
    name: Rerun Verify Assign and Link
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Find linked pull requests and rerun validation
        uses: ./.github/actions/verify-assign-and-link
        with:
          mode: rerun
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          issue-number: ${{ github.event.issue.number }}
